<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up | Student Doubt Forum</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark">SD</span> Doubt Forum</a>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-secondary btn-sm">Back to home</a>
    </div>
  </div>
</nav>

<main class="login-main">
  <section class="login-panel" aria-labelledby="signup-title">
    <div class="login-intro">
      <span class="eyebrow">New account</span>
      <h1 id="signup-title">Join the forum.</h1>
      <p class="text-soft">Pick your role, create your login, and start asking or answering.</p>
    </div>

    <div class="role-selector" role="radiogroup" aria-label="Choose account type">
      <button type="button" class="role-option is-selected" data-signup-role="student" role="radio" aria-checked="true">
        <span class="role-icon" aria-hidden="true">S</span>
        <span><strong>Student</strong><small>Ask and track your doubts</small></span>
      </button>
      <button type="button" class="role-option" data-signup-role="teacher" role="radio" aria-checked="false">
        <span class="role-icon" aria-hidden="true">T</span>
        <span><strong>Teacher</strong><small>Review and answer doubts</small></span>
      </button>
    </div>

    <form id="signup-form" novalidate>
      <input type="hidden" id="signup-role" name="role" value="student" />
      <div class="field">
        <label for="signup-name">Full name</label>
        <input type="text" id="signup-name" name="name" autocomplete="name" placeholder="Your name" required />
      </div>
      <div class="field">
        <label for="signup-email">College email</label>
        <input type="email" id="signup-email" name="email" autocomplete="email" placeholder="you@college.edu" required />
      </div>
      <div class="field">
        <label for="signup-password">Password</label>
        <div style="position:relative;">
          <input type="password" id="signup-password" name="password" autocomplete="new-password" placeholder="At least 6 characters" required style="padding-right:44px;" />
          <button type="button" data-password-toggle aria-label="Show password" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent; cursor:pointer; color:var(--ink-faint); padding:6px; display:flex;"></button>
        </div>
      </div>
      <p id="signup-error" class="form-error" role="alert" aria-live="polite"></p>
      <button type="submit" class="btn btn-primary btn-block">Create account <span aria-hidden="true">→</span></button>
    </form>
    <p class="login-note">Already have an account? <a href="login.html" style="text-decoration:underline; text-underline-offset:3px; font-weight:600;">Log in</a></p>

  </section>
</main>

<script src="script.js?v=3"></script>
</body>
</html>
